[project]
name = "factoryiq"
version = "2.0.0"
description = "AI Manufacturing Intelligence System"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"] # PEP8 errors, Pyflakes, isort

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
